<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#decf92" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#decf92" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#decf92" />
      <stop offset="50%" stop-color="#9e8b43" />
      <stop offset="100%" stop-color="#786a2f" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" />
  <rect width="800" height="800" fill="url(#goldGlow)" />

  <!-- Frame border -->
  <rect x="60" y="60" width="680" height="680" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <rect x="76" y="76" width="648" height="648" rx="12" fill="none" stroke="#decf92" stroke-width="1" stroke-opacity="0.2" />

  <!-- Center Artwork Icon & Canvas -->
  <g transform="translate(400, 360)">
    <!-- Palette / Canvas Frame -->
    <path d="M-60,-50 C-10,-90 60,-50 70,-10 C80,30 40,70 -10,70 C-50,70 -70,30 -70,-10 Z" fill="none" stroke="url(#goldBorder)" stroke-width="3" stroke-linecap="round" />
    <!-- Brushes / Sparkles -->
    <circle cx="-15" cy="-10" r="8" fill="#decf92" opacity="0.8" />
    <circle cx="20" cy="0" r="10" fill="#9e8b43" opacity="0.8" />
    <circle cx="0" cy="30" r="7" fill="#decf92" opacity="0.6" />
    
    <path d="M-40,-70 L50,40" stroke="#decf92" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M45,35 L58,48 L50,55 L38,42 Z" fill="#9e8b43" opacity="0.9" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="490" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#f5ebd2" letter-spacing="4">ALEXPOEIMA</text>
  <text x="400" y="525" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#a8a29e" letter-spacing="3">ORIGINAL COMMISSION</text>
  <text x="400" y="560" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#78716c" letter-spacing="1">Custom Fine Art Canvas</text>
</svg>
